[project]
name = "home-alert"
version = "0.1.0"
description = "Telegram-monitored air-threat notifier for a Kyiv household"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "telethon>=1.44.0",
]

[project.scripts]
home-alert = "home_alert.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["home_alert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
