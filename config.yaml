# home-alert configuration. Secrets come from the environment, never from here.

corpus: research/samples-2026-08-30   # replay source (dir of <channel>.jsonl)
profiles: profiles   # dir of <channel>.yaml -- weights, vocabulary, noise, examples.
                     # A channel with no profile here is not read: these files *are*
                     # the channel list.

# Geometry is named sets, no coordinates (ADR 6). Names are the canonical ones the
# gazetteer in rules.py produces -- aliases and typos (`анонов`, `файна таун`,
# `Соф борщага`, `троя`, `ГОЛОС`) resolve to these before they get here.
home: [Нивки, Антонов]
nearby: [Святошин, Борщагівка, Шулявка, Сирець, Берковець, Виноградар, Біличі,
         Академмістечко, Коцюбинське, Гостомель, Відрадний, Рембаза, Пуща-Водиця]

# Live run. Secrets stay in the environment: TG_API_ID, TG_API_HASH (the phone and
# code are typed once, at first start) and NTFY_TOKEN.
telegram:
  session: data/home-alert     # Telethon appends `.session`; protected volume, ADR note
db: data/home-alert.db         # `replay` uses --db, defaulting to :memory:

drone:
  cooldown_min:      # per tier; gates sounds only, body updates stay unlimited.
                     # Kept per (zone, tier) rather than per tier alone -- a documented
                     # deviation (#12): a WATCH for the ring must not silence a WATCH
                     # for the house one minute later.
    URGENT: 5
    WATCH: 10
    INFO: 20

ballistic:
  resound_gap_min: 2       # minimum gap between sounds on one event; the rest of the
                           # three-stage timings are fixed by the spec, see events.py

# The optional second opinion on messages the rules could not type (SPEC story 28).
# One line switches provider; `none` is the default and the state the agent is
# designed to run in -- GitHub Models is retired and the Copilot SDK turned out not to
# be a completion API (ADR 8, #24), so nothing here may ever be required for an alert.
# Secrets stay in the environment. Anything but `none` is probed once at startup: a
# provider that cannot be called at all stops the agent there rather than fail-opening
# on every message of a raid.
llm:
  provider: none          # none | openai
  base_url: https://openrouter.ai/api/v1   # any OpenAI-compatible endpoint: OpenRouter,
  model: minimax/minimax-m3:free    # Ollama (http://localhost:11434/v1), OpenAI; llama-3.3-70b:free was retired by OpenRouter -- the startup probe caught it live (#24)
  api_key_env: OPENROUTER_API_KEY

system:
  heartbeat_min: 360   # "Агент працює" on the `system` topic; every beat replaces the
                       # last one, so the owner reads one line, not a column of them

ntfy:
  url: https://ntfy.example.net
  token_env: NTFY_TOKEN
  topics:            # family subscribes `urgent`, owner subscribes `urgent` + `all`
    URGENT: urgent
    WATCH: all
    INFO: all
