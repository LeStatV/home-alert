# home-alert configuration. Secrets come from the environment, never from here.

corpus: research/samples-2026-08-30   # replay source (dir of <channel>.jsonl)

channels:            # trust weight per channel
  kpszsu: 1.0
  war_monitor: 0.9
  nebo_raketa: 0.8
  AerisRimor: 0.7
  Ukrainian_Intelligence: 0.6
  kyiv_nebo: 0.6

default_type:        # a bare place-name post from these channels is this type.
  kyiv_nebo: drone   # 88% of its posts carry no type word (channel-eval-kyiv_nebo.md);
                     # moves into the channel profile when #6 introduces them.

# Geometry is named sets, no coordinates (ADR 6). Names are the canonical ones the
# gazetteer in rules.py produces -- aliases and typos (`анонов`, `файна таун`,
# `Соф борщага`, `троя`, `ГОЛОС`) resolve to these before they get here.
home: [Нивки, Антонов]
nearby: [Святошин, Борщагівка, Шулявка, Сирець, Берковець, Виноградар, Біличі,
         Академмістечко, Коцюбинське, Гостомель, Відрадний, Рембаза, Пуща-Водиця]

drone:
  cooldown_min:      # per tier; gates sounds only, body updates stay unlimited
    URGENT: 5
    WATCH: 10
    INFO: 20

ballistic:
  resound_gap_min: 2       # minimum gap between sounds on one event; the rest of the
                           # three-stage timings are fixed by the spec, see events.py

ntfy:
  url: https://ntfy.example.net
  token_env: NTFY_TOKEN
  topics:            # family subscribes `urgent`, owner subscribes `urgent` + `all`
    URGENT: urgent
    WATCH: all
    INFO: all
